[project]
name = "arabic-lesson-scribe"
version = "0.1.0"
description = "Offline Arabic lesson transcriber with a local LLM assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "pywebview==6.2.1",
    "httpx>=0.27,<1",
    "av>=14,<16",
    "sounddevice==0.5.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs network and the tiny Whisper model", "long: about an hour of audio, run with ALS_RUN_LONG=1"]
